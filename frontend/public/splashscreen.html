<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hestia</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: oklch(0.145 0 0);
        border: 1px solid oklch(1 0 0 / 10%);
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        cursor: default;
        user-select: none;
        overflow: hidden;
      }
      .mark {
        width: 132px;
        height: 132px;
      }
      .mark polygon {
        fill-opacity: 0;
        stroke: #f57c12;
        stroke-width: 2.5;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation:
          outline 380ms cubic-bezier(0.16, 1, 0.3, 1) both,
          fill 260ms ease-out 300ms both;
      }
      .mark polygon:nth-of-type(2) {
        animation-delay: 80ms, 380ms;
      }
      .mark polygon:nth-of-type(3) {
        animation-delay: 160ms, 460ms;
      }
      .mark polyline {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: outline 400ms cubic-bezier(0.16, 1, 0.3, 1) 500ms both;
      }
      .word {
        color: oklch(0.985 0 0);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        animation: fade 260ms ease-out 560ms both;
      }
      .bar {
        position: relative;
        width: 104px;
        height: 2px;
        overflow: hidden;
        background: oklch(1 0 0 / 10%);
        animation: fade 260ms ease-out 660ms both;
      }
      .bar::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 35%;
        background: #f57c12;
        animation: sweep 0.9s ease-in-out infinite;
        content: '';
      }
      @keyframes outline {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fill {
        to {
          fill-opacity: 1;
        }
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <svg
      class="mark"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 240 240"
      role="img"
      aria-label="Hestia"
    >
      <g transform="translate(120,120) scale(1.5) translate(-120,-126)">
        <polygon points="120,66 178,95 120,124 62,95" fill="#F0A048" />
        <polygon points="62,95 120,124 120,186 62,157" fill="#F57C12" />
        <polygon points="120,124 178,95 178,157 120,186" fill="#D9650A" />
        <g
          transform="translate(.7 .7)"
          fill="none"
          stroke="#8A3C05"
          stroke-width="6.5"
          stroke-linejoin="miter"
          stroke-linecap="butt"
        >
          <polyline
            points="93.3,95 120,81.6 146.7,95 120,108.4 103.7,100.2 120,92 127.4,95.7"
          />
          <polyline
            points="76.4,148.8 76.4,117.6 105.6,132.2 105.6,163.4 87.8,154.5 87.8,135.4 95.9,139.5"
          />
          <polyline
            points="134.4,163.4 134.4,132.2 163.6,117.6 163.6,148.8 145.8,157.7 145.8,138.7 153.9,134.6"
          />
        </g>
        <g
          fill="none"
          stroke="#FFF3E0"
          stroke-width="6.5"
          stroke-linejoin="miter"
          stroke-linecap="butt"
        >
          <polyline
            points="93.3,95 120,81.6 146.7,95 120,108.4 103.7,100.2 120,92 127.4,95.7"
          />
          <polyline
            points="76.4,148.8 76.4,117.6 105.6,132.2 105.6,163.4 87.8,154.5 87.8,135.4 95.9,139.5"
          />
          <polyline
            points="134.4,163.4 134.4,132.2 163.6,117.6 163.6,148.8 145.8,157.7 145.8,138.7 153.9,134.6"
          />
        </g>
      </g>
    </svg>
    <span class="word">Hestia</span>
    <span class="bar"></span>
  </body>
</html>
