[package]
name = "client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The HTTP transport for a remote node. Off by default so a front-end that only
# ever talks to the local socket does not link an HTTP stack.
remote = ["dep:reqwest", "dep:keyring", "dep:percent-encoding", "dep:uuid", "dep:futures-util"]

[dependencies]
proto = { workspace = true }
ipc = { workspace = true }
common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
keyring = { version = "3.6.3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
percent-encoding = { version = "2.3.2", optional = true }
uuid = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
