name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # husky-rs installs the repo's git hooks from its build script; a CI checkout
  # has nothing to commit or push, so it has no use for them.
  NO_HUSKY_HOOKS: 1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tray Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude desktop --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      # src/paraglide/ is generated and untracked, and the app imports from it,
      # so the messages compile before anything that resolves those imports.
      - name: generate messages
        run: bun run generate:messages
      - name: check
        run: bun run check
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
      - name: build
        run: bun run build

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
