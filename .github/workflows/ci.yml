name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # release.yml calls this workflow as its gate, so a tag cannot publish
  # artifacts that never passed the same checks a branch push does.
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always
  # husky-rs installs the repo's git hooks from its build script; a CI checkout
  # has nothing to commit or push, so it has no use for them.
  NO_HUSKY_HOOKS: 1

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tray Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude desktop --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude desktop

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: install
        run: bun install --frozen-lockfile
      # src/paraglide/ is generated and untracked, and the app imports from it,
      # so the messages compile before anything that resolves those imports.
      - name: generate messages
        run: bun run generate:messages
      - name: check
        run: bun run check
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
      - name: build
        run: bun run build

  # `check` excludes the desktop crate so it needs no webview, which left the
  # Tauri shell's Rust unlinted everywhere. Compiling it is not free — the
  # bundler's `externalBin` entries must exist on disk and `generate_context!`
  # embeds frontend/dist — so it gets its own job rather than slowing `check`.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # generate_context! embeds the built frontend, so dist must exist before
      # the crate compiles. The paraglide plugin compiles messages during the
      # vite build, so this needs no separate generate:messages step.
      - name: Build the frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build
      # Debug sidecars, not release: tauri-build only checks the staged files
      # exist, and this job never produces an installer.
      - name: Stage sidecars
        run: scripts/sidecars.sh --debug
      - name: clippy
        run: cargo clippy -p desktop --all-targets -- -D warnings
      - name: test
        run: cargo test -p desktop

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
